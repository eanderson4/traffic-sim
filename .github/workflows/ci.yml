name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: engine/go.sum
      - name: gofmt
        working-directory: engine
        run: test -z "$(gofmt -l .)"
      - name: vet
        working-directory: engine
        run: go vet ./...
      - name: test
        working-directory: engine
        # -p 1: one test binary at a time. The natsio suite runs embedded
        # NATS servers against real-time cadences (fixed-cadence lag
        # acceptance, hold-last healing, slow consumers); sharing the runner
        # with three other package binaries makes those schedules the
        # environment's, not the product's, and the suite flakes as a
        # family (TestBatchAppliedLagBoundary, TestAttachHandshake,
        # TestClaimExclusivity, TestHoldLastThenDecay all failed CI under
        # cross-package load while passing locally). Serial packages give
        # each binary the whole runner, which is what the timing assertions
        # assume.
        run: go test ./... -count=1 -p 1

  viz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: viz/pnpm-lock.yaml
      - name: install
        working-directory: viz
        run: pnpm install --frozen-lockfile
      - name: typecheck
        working-directory: viz
        run: pnpm check
      - name: test
        working-directory: viz
        run: pnpm test
